name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per branch/PR: a new push cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:components

  integration:
    name: Integration tests (local Supabase)
    # Only start Docker/Supabase once the cheap checks pass.
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: 2.108.0

      # Applies supabase/migrations + seed.sql. The tests only need Postgres, the API gateway (kong),
      # auth (GoTrue, always started) and PostgREST (rest), so everything else is skipped.
      - name: Start Supabase
        run: supabase start -x analytics,edge-runtime,functions,imgproxy,inbucket,meta,realtime,storage,studio,vector

      - name: Lint database schema
        run: supabase db lint --local --fail-on error

      - name: Export Supabase connection for tests
        run: |
          supabase status -o json > "$RUNNER_TEMP/supabase-status.txt"
          node -e '
            const fs = require("node:fs");
            const out = fs.readFileSync(process.argv[1], "utf8");
            const s = JSON.parse(out.slice(out.indexOf("{"), out.lastIndexOf("}") + 1));
            for (const k of ["API_URL", "PUBLISHABLE_KEY", "SECRET_KEY"]) {
              if (!s[k]) { console.error(`supabase status: missing ${k}`); process.exit(1); }
            }
            console.log(`::add-mask::${s.SECRET_KEY}`);
            fs.appendFileSync(process.env.GITHUB_ENV,
              `SUPABASE_URL=${s.API_URL}\nSUPABASE_PUBLISHABLE_KEY=${s.PUBLISHABLE_KEY}\nSUPABASE_SECRET_KEY=${s.SECRET_KEY}\n`);
          ' "$RUNNER_TEMP/supabase-status.txt"

      - run: npm run test:integration

  e2e:
    name: E2E tests (Playwright, local Supabase)
    # Browser journeys (e2e/, issue #13) on desktop and 375 px. Blocks the migrations and the deploy.
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: 2.108.0

      # Same as the integration job, plus the mail catcher (inbucket = Mailpit) for the magic link.
      - name: Start Supabase
        run: supabase start -x analytics,edge-runtime,functions,imgproxy,meta,realtime,storage,studio,vector

      - name: Export Supabase connection for the build and the tests
        run: |
          supabase status -o json > "$RUNNER_TEMP/supabase-status.txt"
          node -e '
            const fs = require("node:fs");
            const out = fs.readFileSync(process.argv[1], "utf8");
            const s = JSON.parse(out.slice(out.indexOf("{"), out.lastIndexOf("}") + 1));
            for (const k of ["API_URL", "PUBLISHABLE_KEY", "SECRET_KEY", "INBUCKET_URL"]) {
              if (!s[k]) { console.error(`supabase status: missing ${k}`); process.exit(1); }
            }
            console.log(`::add-mask::${s.SECRET_KEY}`);
            fs.appendFileSync(process.env.GITHUB_ENV, [
              `SUPABASE_URL=${s.API_URL}`,
              `SUPABASE_PUBLISHABLE_KEY=${s.PUBLISHABLE_KEY}`,
              `SUPABASE_SECRET_KEY=${s.SECRET_KEY}`,
              `SUPABASE_MAIL_URL=${s.INBUCKET_URL}`,
              `NEXT_PUBLIC_SUPABASE_URL=${s.API_URL}`,
              `NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${s.PUBLISHABLE_KEY}`,
              "",
            ].join("\n"));
          ' "$RUNNER_TEMP/supabase-status.txt"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the static export and serves it on :3000 (the auth redirect URL).
      - run: npm run test:e2e

      - name: Upload report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  migrate:
    name: Apply migrations to hosted Supabase
    # Only from main, never on pull requests (the secrets exist only in this job). Never the seed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One migration run at a time, never cancelled half-way.
    concurrency:
      group: supabase-migrations
      cancel-in-progress: false
    env:
      SUPABASE_PROJECT_REF: fayeuqhjbnuvxjiysxls
      # No database password: the CLI logs in with a temporary role created through the access token.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Set the repository secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.108.0

      # The CLI reads the token from the environment (masked in the logs).
      - name: Link the hosted project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Applies only the migrations missing from the remote history; a failure stops the deploy.
      - name: Push migrations
        run: supabase db push --linked --yes

  deploy:
    name: Deploy to GitHub Pages
    # Static export (docs: README "Deploying"); only from main, after the migrations are applied.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, integration, e2e, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    # Never cancel a deployment half-way (the workflow-level group cancels older runs).
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check repository variables
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set the repository variables NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v6

      # next build (output: export) + .nojekyll + flattened prefetch files, into ./out
      - run: npm run build:pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v5
