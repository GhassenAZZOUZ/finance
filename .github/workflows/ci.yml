name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per branch/PR: a new push cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  integration:
    name: Integration tests (local Supabase)
    # Only start Docker/Supabase once the cheap checks pass.
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v3
        with:
          version: 2.108.0

      # Applies supabase/migrations + seed.sql. The tests only need Postgres, the API gateway (kong),
      # auth (GoTrue, always started) and PostgREST (rest), so everything else is skipped.
      - name: Start Supabase
        run: supabase start -x analytics,edge-runtime,functions,imgproxy,inbucket,meta,realtime,storage,studio,vector

      - name: Lint database schema
        run: supabase db lint --local --fail-on error

      - name: Export Supabase connection for tests
        run: |
          supabase status -o json > "$RUNNER_TEMP/supabase-status.txt"
          node -e '
            const fs = require("node:fs");
            const out = fs.readFileSync(process.argv[1], "utf8");
            const s = JSON.parse(out.slice(out.indexOf("{"), out.lastIndexOf("}") + 1));
            for (const k of ["API_URL", "PUBLISHABLE_KEY", "SECRET_KEY"]) {
              if (!s[k]) { console.error(`supabase status: missing ${k}`); process.exit(1); }
            }
            console.log(`::add-mask::${s.SECRET_KEY}`);
            fs.appendFileSync(process.env.GITHUB_ENV,
              `SUPABASE_URL=${s.API_URL}\nSUPABASE_PUBLISHABLE_KEY=${s.PUBLISHABLE_KEY}\nSUPABASE_SECRET_KEY=${s.SECRET_KEY}\n`);
          ' "$RUNNER_TEMP/supabase-status.txt"

      - run: npm run test:integration
