<style>
body{margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;background:#F3F0E8;color:#1D1C19}
a{color:#1F4B3B}
.serif{font-family:Newsreader,Georgia,serif}
.num{font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:#57534B;line-height:1.45}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#1D1C19;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.fc{background:#FFFFFF;border:1px solid #DDD7CA;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fc label{font-size:15px;font-weight:600}
.big{box-sizing:border-box;width:100%;height:56px;border:1px solid #D6CFBF;border-radius:14px;background:#FBFAF6;padding:0 40px 0 16px;font:500 22px "IBM Plex Sans",sans-serif;font-variant-numeric:tabular-nums;text-align:right;color:#1D1C19}
.big:focus{outline:2px solid #1D1C19;outline-offset:1px;background:#FFFFFF}
.eur{position:relative}.eur::after{content:"€";position:absolute;right:16px;top:16px;font-size:18px;color:#6B665C}
.chip{border:1px solid #CFC8B8;background:#FFFFFF;border-radius:999px;min-height:36px;padding:0 12px;font:500 13px "IBM Plex Sans",sans-serif;color:#1D1C19;cursor:pointer}
</style>

<div style="width: 390px; height: 844px; position: relative; background: #F3F0E8; overflow: hidden; display: flex; flex-direction: column">

<a class="ib" href="Mobile.dc.html" aria-label="Fermer la saisie"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
<span style="font-size: 15px; font-weight: 600">Suivi · août 2026</span>
<span style="width: 44px"></span>
</header>

<div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 10px">
<ol aria-label="Étapes" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<li aria-current="step" style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 2px; background: #1D1C19"></span><span style="font-size: 12px; font-weight: 600">1 · Épargne</span></li>
<li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 2px; background: #DDD7CA"></span><span style="font-size: 12px; color: #57534B">2 · Crédits</span></li>
<li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 2px; background: #DDD7CA"></span><span style="font-size: 12px; color: #57534B">3 · Vérifier</span></li>
</ol>
<h1 class="serif" style="margin: 6px 0 0; font-size: 28px; line-height: 1.15; font-weight: 500">Combien avez-vous épargné fin août ?</h1>
<p class="hint" style="margin: 0">Reportez les soldes de vos comptes. Le prévu est indiqué pour chaque compte.</p>
</div>

<main style="flex-grow: 1; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 1px dashed #1F4B3B; border-radius: 14px; background: #F1F7F3; color: #1F4B3B; font: 600 15px 'IBM Plex Sans', sans-serif; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Tout est comme prévu</button>

<div class="fc">
<div style="display: flex; justify-content: space-between; align-items: baseline"><label for="m1">Déménagement</label><span class="hint num">prévu 1 387,10 €</span></div>
<div class="eur"><input id="m1" class="big" inputmode="decimal" value="1 387,10" readonly></div>
<span class="num" style="font-size: 13px; font-weight: 600; color: #2F6B4F">✓ conforme au plan</span>
</div>

<div class="fc" style="border-color: #1D1C19; box-shadow: 0 0 0 1px #1D1C19">
<div style="display: flex; justify-content: space-between; align-items: baseline"><label for="m2">Fonds d’urgence</label><span class="hint num">prévu 800,00 €</span></div>
<div class="eur"><input id="m2" class="big" inputmode="decimal" value="" placeholder="0,00" readonly style="background: #FFFFFF; outline: 2px solid #1D1C19; outline-offset: 1px"></div>
<div style="display: flex; gap: 8px"><button type="button" class="chip num">= 800,00 €</button><button type="button" class="chip">Même qu’en juillet</button></div>
</div>

<div class="fc">
<div style="display: flex; justify-content: space-between; align-items: baseline"><label for="m3">Épargne libre</label><span class="hint num">prévu 0,00 €</span></div>
<div class="eur"><input id="m3" class="big" inputmode="decimal" value="" placeholder="0,00" readonly></div>
</div>
</main>

<div style="padding: 12px 16px 30px; background: #F3F0E8; border-top: 1px solid #DDD7CA; display: flex; align-items: center; gap: 12px">
<span class="hint" style="flex-grow: 1">1 sur 3</span>
<a href="Mobile.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 14px; background: #1D1C19; color: #F3F0E8; font-weight: 600; font-size: 16px; text-decoration: none">Suivant : crédits<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 5l7 7-7 7"></path></svg></a>
</div>
</div>
